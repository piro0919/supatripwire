name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # tests/directory.test.ts builds its own schema and a column-granted
      # read-only role here, so the database lookups run against real Postgres.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPATRIPWIRE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm secretlint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:lib
      - run: pnpm check:package
      - run: node dist/cli.js --help

  # engines says >=20. Build on 24, then load the built CLI and library on 20.
  node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node dist/cli.js --help
      - run: node --input-type=module -e "const m = await import('supatripwire'); if (typeof m.runChecks !== 'function') process.exit(1);"
      - run: node --input-type=module -e "const m = await import('supatripwire/fetch'); if (typeof m.tripwireFetch !== 'function') process.exit(1);"
