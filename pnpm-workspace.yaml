# pnpm 11 ignores pnpm.onlyBuiltDependencies in package.json and fails the
# install until every package with a build script is listed here. esbuild is
# fetched by tsup and vitest; lefthook installs the git hooks.
allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.9"
  - "@biomejs/cli-android-arm64@2.6.9"
  - "@biomejs/cli-android-x64@2.6.9"
  - "@biomejs/cli-darwin-arm64@2.6.9"
  - "@biomejs/cli-darwin-x64@2.6.9"
  - "@biomejs/cli-linux-arm64-musl@2.6.9"
  - "@biomejs/cli-linux-arm64@2.6.9"
  - "@biomejs/cli-linux-x64-musl@2.6.9"
  - "@biomejs/cli-linux-x64@2.6.9"
  - "@biomejs/cli-win32-arm64@2.6.9"
  - "@biomejs/cli-win32-x64@2.6.9"
  - "@vitest/mocker@5.1.2"
  - "@vitest/spy@5.1.2"
  - lefthook-android-arm64@2.2.3
  - lefthook-darwin-arm64@2.2.3
  - lefthook-darwin-x64@2.2.3
  - lefthook-freebsd-arm64@2.2.3
  - lefthook-freebsd-x64@2.2.3
  - lefthook-linux-arm64@2.2.3
  - lefthook-linux-x64@2.2.3
  - lefthook-openbsd-arm64@2.2.3
  - lefthook-openbsd-x64@2.2.3
  - lefthook-windows-arm64@2.2.3
  - lefthook-windows-x64@2.2.3
  - lefthook@2.2.3
  - vitest@5.1.2
